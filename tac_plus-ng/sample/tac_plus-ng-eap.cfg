#!/usr/bin/env -S /usr/local/bin/tactrace.pl --user cert-user --conf

# RADIUS EAP-TLS termination.
#
# tac_plus-ng terminates EAP-TLS itself; it does not proxy EAP to an external
# server. EAP-TLS is the only supported EAP method in this phase.
#
# The server certificate/key and the CA that signs the EAP peer's client
# certificate are the demo CA files generated by sample/democa:
#
#     make -C tac_plus-ng/sample/democa
#
# The EAP peer needs a client certificate signed by the same CA and carrying
# the clientAuth extended key usage; the server verifies it against ca-file.
#
# Identity: with eap-identity-source = cert-cn, the user name is the CN of the
# peer certificate, lowercased. Define the matching user in lower case; this
# sample's "cert-user" expects a certificate with CN "cert-user" (or "CERT-USER",
# which is lowercased before the lookup). Certificate SANs are handled the same
# way with eap-identity-source = cert-san.
#
# MFA: if the selected user or host requires MFA, EAP authentication is
# rejected with EAP-Failure. MFA cannot be challenged inside EAP-TLS.
#
# UDP: EAP state is local to the worker handling the request. Multi-worker UDP
# EAP therefore needs shared state; the EAP broker arrives in a later phase.
# Until then run with spawnd "single process = yes" or "sticky cache period" so
# all packets of one conversation reach the same worker. This sample uses
# "single process = yes".
#
# TLS profile: this implementation deliberately requires TLS 1.2 and modern
# ciphers. RFC 5216 requires TLS 1.0 and lists 3DES/RC4 suites; those are
# deprecated by RFC 8996. Compression, session resumption, and EAP privacy/
# fast reconnect are not negotiated. TLS 1.3 (RFC 9190) is a follow-up.
#
# There is no broker-socket keyword in this phase; it arrives with the UDP EAP
# broker.
#
# To disable EAP inherited from the default realm in a child realm:
#
#     realm lab {
#         eap = no
#     }

id = spawnd {
	background = no
	# EAP over RADIUS/TLS (RadSec) pins the conversation to one worker.
	# Uncomment this together with the tls credentials below.
	# listen { port = 2083 tls = yes }
	# RADIUS over UDP: EAP needs single process or sticky cache until the
	# broker exists.
	listen { port = 1812 protocol = UDP }
	listen { port = 1813 protocol = UDP flag = accounting }
	# For multi-worker UDP EAP, the later EAP broker is required. Until then
	# use single process = yes or sticky cache period.
	single process = yes
}

id = tac_plus-ng {
	include = $CONFDIR/radius-dict.cfg

	eap {
		eap-method = tls
		cert-file = $CONFDIR/democa/server-chain.pem
		key-file = $CONFDIR/democa/server.key
		ca-file = $CONFDIR/democa/root.crt
		verify-client = yes
		eap-identity-source = cert-cn
		timeout = 60
		max-message = 65535
		max-sessions = 4096
	}

	# TLS server credentials for a RadSec listener (see the commented listen
	# line above). EAP-TLS uses the dedicated eap block; do not share an
	# EAP-TLS server key with HTTPS or other services in production
	# (RFC 5216 5.1).
	tls cert-file = $CONFDIR/democa/server-chain.pem
	tls key-file = $CONFDIR/democa/server.key
	tls ca-file = $CONFDIR/democa/root.crt

	device world {
		address = ::/0
		radius.key = demo
	}

	profile eap-profile {
		script {
			if (aaa.protocol == radius) {
				set radius[Cisco:Cisco-AVPair] = "shell:priv-lvl=15"
				permit
			}
		}
	}

	# The name comes from the lowercased certificate identity.
	user cert-user {
		profile = eap-profile
	}
}
