# Local users in groups, profiles selected by first-match rules,
# single-connection device.

id = spawnd {
	listen = { address = 127.0.0.1 port = 4949 }
	spawn = { instances min = 1 instances max = 1 }
	background = no
}

id = tac_plus-ng {
	device lab {
		address = 127.0.0.1
		key = testkey
		single-connection = yes
	}

	group netadmin { }
	group contractor { }

	user netadmin { password login = clear pw1 member = netadmin }
	user contractor { password login = clear pw2 member = contractor }

	profile admin { script { if (service == shell) { set priv-lvl = 15 permit } } }
	profile limited { script { if (service == shell) { set priv-lvl = 1 permit } } }

	ruleset {
		rule netadmins {
			enabled = yes
			script {
				label = "netadmin -> admin"
				if (member == netadmin) {
					profile = admin
					permit
				}
			}
		}
		rule contractors {
			script {
				if (member == contractor) {
					profile = limited
					permit
				}
			}
		}
	}
}
