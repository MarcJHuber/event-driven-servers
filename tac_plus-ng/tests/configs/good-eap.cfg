# Realm EAP-TLS block with every Phase 1 keyword. Parse-only does not
# create the SSL_CTX, so the certificate paths need not exist.

id = spawnd {
	listen = { address = 127.0.0.1 port = 4949 }
	background = no
}

id = tac_plus-ng {
	eap {
		eap-method = tls
		cert-file = $tmp/ca/server-chain.pem
		key-file = $tmp/ca/server.key
		ca-file = $tmp/ca/root.crt
		passphrase = secret
		verify-client = yes
		eap-identity-source = cert-san
		timeout = 120
		max-message = 60000
		max-sessions = 1024
	}

	device a {
		address = 127.0.0.1
		key = testkey
	}

	user alice {
		password login = clear alice
	}
}
