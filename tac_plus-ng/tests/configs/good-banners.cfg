# Per-device banners, including empty ones (from the reproducer of an
# empty "log format" / banner crash).

id = spawnd {
	listen = { address = 127.0.0.1 port = 4949 }
	background = no
}

id = tac_plus-ng {
	device a {
		address = 127.0.0.1
		key = testkey
		welcome banner = "WELCOME\n"
		motd banner = "MOTD\n"
		reject banner = "REJECT\n"
	}
	device b {
		address = 127.0.0.2
		key = testkey
		welcome banner = ""
		motd banner = ""
	}

	user alice {
		password login = clear alice
	}
	user bob {
		password login = clear bob
	}

	ruleset {
		rule { script { if (user == alice) permit deny } }
	}
}
