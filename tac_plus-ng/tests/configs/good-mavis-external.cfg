# External MAVIS backend with one child and no daemon-side cache.
# -P checks that the executable exists; /bin/cat stands in for a module.

id = spawnd {
	listen = { address = 127.0.0.1 port = 4949 }
	spawn = { instances min = 1 instances max = 1 }
	background = no
}

id = tac_plus-ng {
	mavis module = external {
		exec = /bin/cat
		childs min = 1
		childs max = 1
	}
	mavis cache timeout = 0
	mavis format custom_0 = "${authen-service}"

	user backend = mavis
	login backend = mavis
	pap backend = mavis

	device world {
		address = 0.0.0.0/0
		key = testkey
	}

	ruleset {
		rule { script { permit } }
	}
}
